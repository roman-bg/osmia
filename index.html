<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#5a3e1b">
    <meta name="description" content="Интерактивен определител за 15-те най-често срещани вида земни пчели в България">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Земни пчели BG">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <link rel="icon" type="image/png" sizes="32x32" href="icon-48x48.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon-48x48.png">
    
    <title>Определител на земни пчели | PWA</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f7f3e9; margin: 0; padding: 12px; color: #2c3e2f; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; padding: 1rem; }
        h1 { font-size: 1.5rem; margin: 0; color: #5a3e1b; display: flex; align-items: center; gap: 8px; }
        h1:before { content: "🐝"; }
        .sub { color: #6b4c2c; border-left: 3px solid #f4b942; padding-left: 12px; margin: 0.5rem 0 1rem; font-size: 0.85rem; }
        .filter-panel { background: #fff7e8; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; border: 1px solid #ffe0a3; }
        .filter-group { margin-bottom: 0.8rem; }
        .filter-group label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.75rem; color: #7a5a3a; }
        select, .reset-btn { width: 100%; padding: 10px; border-radius: 50px; border: 1px solid #d9c7a6; background: white; font-size: 0.9rem; appearance: none; }
        .reset-btn { background: #f0e2ce; font-weight: 600; color: #5a3e1b; border: none; margin-top: 5px; cursor: pointer; }
        .stats { background: #eef4e6; border-radius: 40px; padding: 0.4rem 1rem; display: inline-block; margin-bottom: 1rem; font-size: 0.8rem; font-weight: 500; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 1rem; border: 1px solid #f3e5cd; overflow: hidden; }
        .card-header { background: #fef5e3; padding: 0.8rem; border-bottom: 1px solid #ffe1a8; }
        .card-header h3 { margin: 0; font-size: 1.1rem; color: #3f2a10; }
        .latin { font-style: italic; font-size: 0.75rem; color: #7c6b4b; }
        .card-body { padding: 0.8rem; }
        .feature-list { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; }
        .feature-tag { font-weight: 700; color: #b46f2a; margin-right: 5px; }
        .badge { display: inline-block; background: #f2e5d2; border-radius: 20px; padding: 4px 10px; font-size: 0.7rem; font-weight: 600; margin-top: 8px; }
        .install-banner { display: none; background: #5a3e1b; color: white; padding: 12px; border-radius: 50px; text-align: center; margin-top: 10px; cursor: pointer; font-weight: 600; }
        footer { text-align: center; font-size: 0.7rem; color: #aa9b7e; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Определител на земни пчели</h1>
    <div class="sub">🔍 Интерактивен ключ за 15 вида в България</div>

    <div class="filter-panel">
        <div class="filter-group">
            <label>🐚 Цвят на коремчето</label>
            <select id="filterAbdomen">
                <option value="all">Всички</option>
                <option value="жълто-черни ивици">Жълто-черни ивици</option>
                <option value="червено-кафяв връх">Червено/кафяв връх</option>
                <option value="бял връх">Бял връх на коремчето</option>
                <option value="преобладаващо черно">Преобладаващо черно</option>
                <option value="оранжево-червена ивица">Оранжево-червена ивица</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🟡 Цвят на гърдите</label>
            <select id="filterThorax">
                <option value="all">Всички</option>
                <option value="жълт">Жълт</option>
                <option value="черен">Черен</option>
                <option value="жълт с черна лента">Жълт с черна лента</option>
                <option value="сиво-жълт">Сиво-жълт</option>
            </select>
        </div>
        <button id="resetFilters" class="reset-btn">🔄 Изчисти филтрите</button>
    </div>

    <div class="stats" id="statsDisplay">Зареждане...</div>
    <div id="speciesGrid"></div>
    
    <div id="installBanner" class="install-banner">📱 Инсталирай приложението ➕</div>
    <footer>Използвайте филтрите за по-точно определяне.</footer>
</div>

<script>
    const bumblebeeSpecies = [
        { name: "Земна пчела каменарка", latin: "Bombus lapidarius", abdomenColor: "черно, червено-кафяв връх", thoraxColor: "черен", fAbs: "червено-кафяв връх", fThor: "черен", features: ["⚫ Черно тяло", "🔴 Яркочервен връх"] },
        { name: "Земна пчела горска", latin: "Bombus sylvarum", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", fAbs: "бял връх", fThor: "жълт с черна лента", features: ["🍂 Жълт гръден кош с черно петно", "⚪ Бял край"] },
        { name: "Земна пчела полска", latin: "Bombus pascuorum", abdomenColor: "жълто-кафяво, червеникаво", thoraxColor: "сиво-жълт", fAbs: "оранжево-червена ивица", fThor: "сиво-жълт", features: ["🧡 Златисто-кафява", "Много чест вид"] },
        { name: "Земна пчела земна", latin: "Bombus terrestris", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", fAbs: "бял връх", fThor: "жълт с черна лента", features: ["🐝 Една от най-едрите"] },
        { name: "Земна пчела ливадна", latin: "Bombus pratorum", abdomenColor: "жълто-черни ивици, оранжев връх", thoraxColor: "жълт", fAbs: "жълто-черни ивици", fThor: "жълт", features: ["🍊 Оранжева опашка"] },
        { name: "Земна пчела рудоноса", latin: "Bombus ruderatus", abdomenColor: "жълто-черни ивици", thoraxColor: "жълт", fAbs: "жълто-черни ивици", fThor: "жълт", features: ["🔸 Дълго лице"] },
        { name: "Земна пчела голяма горска", latin: "Bombus hypnorum", abdomenColor: "жълто-кафяв, бял връх", thoraxColor: "жълт", fAbs: "бял връх", fThor: "жълт", features: ["🌲 Гърдите червеникави"] },
        { name: "Земна пчела люцернова", latin: "Bombus rupestris", abdomenColor: "преобладаващо черно, червена опашка", thoraxColor: "черен", fAbs: "преобладаващо черно", fThor: "черен", features: ["🖤 Почти черна", "Кукувичен вид"] },
        { name: "Земна пчела планинска", latin: "Bombus monticola", abdomenColor: "черно, червено-кафяв връх", thoraxColor: "жълт с черна лента", fAbs: "червено-кафяв връх", fThor: "жълт с черна лента", features: ["⛰️ Планински вид"] },
        { name: "Земна пчела сменчива", latin: "Bombus soroeensis", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", fAbs: "бял връх", fThor: "жълт with черна лента", features: ["🏵️ Жълти петна отстрани"] },
        { name: "Земна пчела черна", latin: "Bombus melanopygus", abdomenColor: "преобладаващо черно", thoraxColor: "черен", fAbs: "преобладаващо черно", fThor: "черен", features: ["⚫ Изцяло черна"] },
        { name: "Земна пчела конска", latin: "Bombus veteranus", abdomenColor: "жълто-черни ивици, червеникав връх", thoraxColor: "жълт", fAbs: "жълто-черни ивици", fThor: "жълт", features: ["🐎 Сиво-жълти косми"] },
        { name: "Земна пчела червеникава", latin: "Bombus ruderarius", abdomenColor: "червено-кафяв връх", thoraxColor: "черен", fAbs: "червено-кафяв връх", fThor: "черен", features: ["🟠 Малка, черна с червена опашка"] },
        { name: "Земна пчела балканска", latin: "Bombus balcanicus", abdomenColor: "жълто-черни ивици", thoraxColor: "жълт с черна лента", fAbs: "жълто-черни ивици", fThor: "жълт с черна лента", features: ["🏔️ Балкански ендемит"] },
        { name: "Земна пчела кафява", latin: "Bombus humilis", abdomenColor: "оранжево-червена ивица", thoraxColor: "сиво-жълт", fAbs: "оранжево-червена ивица", fThor: "сиво-жълт", features: ["🤎 Сухи тревни места"] }
    ];

    function applyFilters() {
        const vAbs = document.getElementById('filterAbdomen').value;
        const vThor = document.getElementById('filterThorax').value;

        const filtered = bumblebeeSpecies.filter(s => 
            (vAbs === "all" || s.fAbs === vAbs) &&
            (vThor === "all" || s.fThor === vThor)
        );

        document.getElementById('statsDisplay').textContent = `Показани ${filtered.length} от ${bumblebeeSpecies.length} вида`;
        document.getElementById('speciesGrid').innerHTML = filtered.map(s => `
            <div class="card">
                <div class="card-header"><h3>${s.name}</h3><div class="latin">${s.latin}</div></div>
                <div class="card-body">
                    <ul class="feature-list">
                        <li><span class="feature-tag">Корем:</span> ${s.abdomenColor}</li>
                        <li><span class="feature-tag">Гърди:</span> ${s.thoraxColor}</li>
                    </ul>
                    <div class="badge">🔎 ${s.features.join(" · ")}</div>
                </div>
            </div>
        `).join('');
    }

    document.querySelectorAll('select').forEach(el => el.addEventListener('change', applyFilters));
    document.getElementById('resetFilters').addEventListener('click', () => {
        document.querySelectorAll('select').forEach(s => s.value = "all");
        applyFilters();
    });

    applyFilters();

    // PWA регистрация - БЕЗ наклонена черта
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log("SW OK"));
    }

    // Проверка за APK режим
    const isApp = window.matchMedia('(display-mode: standalone)').matches || document.referrer.includes('android-app://');
    if (isApp) {
        document.getElementById('installBanner').style.display = 'none';
    } else {
        let defPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); defPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });
        document.getElementById('installBanner').addEventListener('click', () => {
            if (defPrompt) defPrompt.prompt();
        });
    }
</script>
</body>
</html>
