<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#5a3e1b">
    <meta name="description" content="Интерактивен определител за 15-те най-често срещани вида земни пчели в България">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Земни пчели BG">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
    
    <title>Определител на земни пчели | PWA</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f7f3e9; margin: 0; padding: 12px; color: #2c3e2f; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; padding: 1rem 1rem 1.2rem; }
        h1 { font-size: 1.6rem; margin: 0 0 0.2rem 0; color: #5a3e1b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        h1:before { content: "🐝"; font-size: 1.8rem; }
        .sub { color: #6b4c2c; border-left: 3px solid #f4b942; padding-left: 12px; margin: 0.3rem 0 1rem 0; font-size: 0.85rem; line-height: 1.3; }
        .filter-panel { background: #fff7e8; border-radius: 1.2rem; padding: 1rem; margin-bottom: 1.2rem; border: 1px solid #ffe0a3; }
        .filter-grid { display: flex; flex-direction: column; gap: 0.75rem; }
        .filter-group label { font-weight: 600; display: block; margin-bottom: 5px; font-size: 0.75rem; color: #7a5a3a; }
        select, .reset-btn { width: 100%; padding: 10px 12px; border-radius: 50px; border: 1px solid #d9c7a6; background: white; font-size: 0.9rem; appearance: none; }
        .reset-btn { background: #f0e2ce; font-weight: 600; color: #5a3e1b; border: none; margin-top: 4px; cursor: pointer; }
        .stats { background: #eef4e6; border-radius: 40px; padding: 0.35rem 1rem; display: inline-block; margin-bottom: 0.9rem; font-size: 0.8rem; font-weight: 500; }
        .card { background: #ffffff; border-radius: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 1rem; border: 1px solid #f3e5cd; }
        .card-header { background: #fef5e3; padding: 0.7rem 1rem; border-bottom: 1px solid #ffe1a8; border-radius: 1.2rem 1.2rem 0 0; }
        .card-header h3 { margin: 0; font-size: 1.15rem; color: #3f2a10; }
        .latin { font-style: italic; font-size: 0.7rem; color: #7c6b4b; }
        .card-body { padding: 0.8rem 1rem; }
        .feature-list { list-style: none; padding: 0; margin: 0; font-size: 0.8rem; }
        .feature-tag { font-weight: 700; color: #b46f2a; font-size: 0.75rem; margin-right: 5px; }
        .badge { display: inline-block; background: #f2e5d2; border-radius: 20px; padding: 4px 10px; font-size: 0.65rem; font-weight: 600; margin-top: 10px; }
        .install-banner { display: none; background: linear-gradient(135deg, #5a3e1b, #7a5a3a); color: white; padding: 12px 16px; border-radius: 60px; font-size: 0.85rem; text-align: center; margin-top: 12px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h1>Определител на земни пчели</h1>
    <div class="sub">🔍 Интерактивен ключ за 15 вида в България</div>

    <div class="filter-panel">
        <div class="filter-grid">
            <div class="filter-group">
                <label>🐚 Цвят на коремчето</label>
                <select id="filterAbdomen">
                    <option value="all">Всички</option>
                    <option value="жълто-черни ивици">Жълто-черни ивици</option>
                    <option value="червено-кафяв връх">Червено/кафяв връх</option>
                    <option value="жълт гръден кош, черно коремче">Жълт гръден кош, черно коремче</option>
                    <option value="бял връх">Бял връх на коремчето</option>
                    <option value="преобладаващо черно">Преобладаващо черно</option>
                    <option value="оранжево-червена ивица">Оранжево-червена ивица</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🟡 Цвят на гърдите/главата</label>
                <select id="filterThorax">
                    <option value="all">Всички</option>
                    <option value="жълт">Жълт (светъл)</option>
                    <option value="черен">Черен</option>
                    <option value="жълт с черна лента">Жълт с черна лента между крилата</option>
                    <option value="сиво-жълт">Сиво-жълт / мръсно жълт</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📏 Размер / особеност</label>
                <select id="filterSize">
                    <option value="all">Всички</option>
                    <option value="едра">Едра пчела (>20 mm)</option>
                    <option value="дребна">Дребна пчела (12–16 mm)</option>
                    <option value="средна">Средна (15–18 mm)</option>
                    <option value="дълго лице">Дълго лице / тясна глава</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔄 Допълнителен маркер</label>
                <select id="special">
                    <option value="all">Всички</option>
                    <option value="бяла опашка">Бяла опашка</option>
                    <option value="червена опашка">Червена опашка</option>
                    <option value="жълт пояс на корема">Жълт пояс на корема</option>
                    <option value="почти изцяло черна">Почти изцяло черна</option>
                </select>
            </div>
            <button id="resetFilters" class="reset-btn">🔄 Изчисти всички</button>
        </div>
    </div>

    <div class="stats" id="statsDisplay">Показване на всички 15 вида</div>
    <div class="species-grid" id="speciesGrid"></div>
    <footer>🐝 Избери характеристики за определяне.</footer>
    <div id="installBanner" class="install-banner">📱 Инсталирай приложението ➕</div>
</div>

<script>
    const bumblebeeSpecies = [
        { name: "Земна пчела каменарка", latin: "Bombus lapidarius", abdomenColor: "черно, червено-кафяв връх", thoraxColor: "черен", sizeNote: "средна до едра (16–20 mm)", specialMark: "червена опашка", features: ["⚫ Черно тяло", "🔴 Яркочервен връх"] },
        { name: "Земна пчела горска", latin: "Bombus sylvarum", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", sizeNote: "дребна до средна (12–16 mm)", specialMark: "бяла опашка", features: ["🍂 Жълт гръден кош с черно петно", "⚪ Бял край"] },
        { name: "Земна пчела полска", latin: "Bombus pascuorum", abdomenColor: "жълто-кафяво, червеникаво", thoraxColor: "сиво-жълт", sizeNote: "средна (14–17 mm)", specialMark: "жълт пояс на корема", features: ["🧡 Златисто-кафява", "Много чест вид"] },
        { name: "Земна пчела земна", latin: "Bombus terrestris", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", sizeNote: "едра (18–24 mm)", specialMark: "бяла опашка", features: ["🐝 Една от най-едрите", "Жълта ивица отпред"] },
        { name: "Земна пчела ливадна", latin: "Bombus pratorum", abdomenColor: "жълто-черни ивици, оранжев връх", thoraxColor: "жълт", sizeNote: "дребна (11–15 mm)", specialMark: "червена опашка", features: ["🍊 Оранжево-червена опашка"] },
        { name: "Земна пчела рудоноса", latin: "Bombus ruderatus", abdomenColor: "жълто-черни ивици", thoraxColor: "жълт", sizeNote: "едра (20–24 mm)", specialMark: "жълт пояс на корема", features: ["🔸 Дълго лице", "Жълта ивица на корема"] },
        { name: "Земна пчела голяма горска", latin: "Bombus hypnorum", abdomenColor: "жълто-кафяв, бял връх", thoraxColor: "жълт", sizeNote: "средна (15–18 mm)", specialMark: "бяла опашка", features: ["🌲 Гърдите червеникави", "Бял връх"] },
        { name: "Земна пчела люцернова", latin: "Bombus rupestris", abdomenColor: "преобладаващо черно, червена опашка", thoraxColor: "черен", sizeNote: "едра (18–22 mm)", specialMark: "червена опашка", features: ["🖤 Почти черна", "Кукувичен вид"] },
        { name: "Земна пчела планинска", latin: "Bombus monticola", abdomenColor: "черно, червено-кафяв връх", thoraxColor: "жълт с черна лента", sizeNote: "средна (14–18 mm)", specialMark: "червена опашка", features: ["⛰️ Планински вид", "Червен връх"] },
        { name: "Земна пчела сменчива", latin: "Bombus soroeensis", abdomenColor: "жълто-черни ивици, бял връх", thoraxColor: "жълт с черна лента", sizeNote: "дребна (12–15 mm)", specialMark: "бяла опашка", features: ["🏵️ Жълти петна отстрани"] },
        { name: "Земна пчела черна", latin: "Bombus melanopygus", abdomenColor: "преобладаващо черно", thoraxColor: "черен", sizeNote: "средна (15–17 mm)", specialMark: "почти изцяло черна", features: ["⚫ Изцяло черна"] },
        { name: "Земна пчела конска", latin: "Bombus veteranus", abdomenColor: "жълто-черни ивици, червеникав връх", thoraxColor: "жълт", sizeNote: "средна (15–18 mm)", specialMark: "жълт пояс на корема", features: ["🐎 Сиво-жълти косми"] },
        { name: "Земна пчела червеникава", latin: "Bombus ruderarius", abdomenColor: "червено-кафяв връх", thoraxColor: "черен", sizeNote: "дребна (12–14 mm)", specialMark: "червена опашка", features: ["🟠 Малка, черна с червена опашка"] },
        { name: "Земна пчела балканска", latin: "Bombus balcanicus", abdomenColor: "жълто-черни ивици", thoraxColor: "жълт с черна лента", sizeNote: "средна (14–17 mm)", specialMark: "жълт пояс на корема", features: ["🏔️ Балкански ендемит"] },
        { name: "Земна пчела кафява", latin: "Bombus humilis", abdomenColor: "оранжево-червена ивица", thoraxColor: "сиво-жълт", sizeNote: "средна (14–16 mm)", specialMark: "оранжево-червена ивица", features: ["🤎 Сухи тревни места"] }
    ];

    function prepareFilters() {
        return bumblebeeSpecies.map(s => {
            let aG = "жълто-черни ивици";
            const abs = s.abdomenColor.toLowerCase();
            if (abs.includes("червено-кафяв") || abs.includes("червеникав")) aG = "червено-кафяв връх";
            else if (abs.includes("бял връх") || s.specialMark === "бяла опашка") aG = "бял връх";
            else if (abs.includes("преобладаващо черно")) aG = "преобладаващо черно";
            else if (abs.includes("оранжево-червена")) aG = "оранжево-червена ивица";

            let tG = "жълт";
            const th = s.thoraxColor.toLowerCase();
            if (th.includes("лента")) tG = "жълт с черна лента";
            else if (th.includes("черен")) tG = "черен";
            else if (th.includes("сиво")) tG = "сиво-жълт";

            let sG = "средна";
            if (s.sizeNote.includes("едра")) sG = "едра";
            else if (s.sizeNote.includes("дребна")) sG = "дребна";
            if (s.features.some(f => f.includes("лице"))) sG = "дълго лице";

            return { ...s, fAbs: aG, fThor: tG, fSize: sG, fSpec: s.specialMark };
        });
    }

    const currentData = prepareFilters();
    const speciesGrid = document.getElementById('speciesGrid');

    function applyFilters() {
        const vAbs = document.getElementById('filterAbdomen').value;
        const vThor = document.getElementById('filterThorax').value;
        const vSize = document.getElementById('filterSize').value;
        const vSpec = document.getElementById('special').value;

        const filtered = currentData.filter(s => 
            (vAbs === "all" || s.fAbs === vAbs) &&
            (vThor === "all" || s.fThor === vThor) &&
            (vSize === "all" || s.fSize === vSize) &&
            (vSpec === "all" || s.fSpec === vSpec)
        );

        document.getElementById('statsDisplay').textContent = `Показани ${filtered.length} вида`;
        speciesGrid.innerHTML = filtered.map(s => `
            <div class="card">
                <div class="card-header"><h3>${s.name}</h3><div class="latin">${s.latin}</div></div>
                <div class="card-body">
                    <ul class="feature-list">
                        <li><span class="feature-tag">Корем:</span> ${s.abdomenColor}</li>
                        <li><span class="feature-tag">Гърди:</span> ${s.thoraxColor}</li>
                    </ul>
                    <div class="badge">🔎 ${s.features.join(" · ")}</div>
                </div>
            </div>
        `).join('');
    }

    document.querySelectorAll('select').forEach(el => el.addEventListener('change', applyFilters));
    document.getElementById('resetFilters').addEventListener('click', () => {
        document.querySelectorAll('select').forEach(s => s.value = "all");
        applyFilters();
    });

    applyFilters();

    // TWA / PWA Fixes
    const isApp = window.matchMedia('(display-mode: standalone)').matches || document.referrer.includes('android-app://');
    if (!isApp) {
        let defPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); defPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });
        document.getElementById('installBanner').addEventListener('click', () => {
            if (defPrompt) defPrompt.prompt();
        });
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js'); // Относителен път без /
    }
</script>
</body>
</html>
